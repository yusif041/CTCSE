<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTCSE | Chat, Talk, Call, Share, Enjoy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=gg+sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #313338;
      color: #dbdee1;
      overflow: hidden;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #2b2d31; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #111214; }

    /* Speaking Pulse Effect */
    .speaking-glow {
      box-shadow: 0 0 0 3px #23a55a, 0 0 12px rgba(35, 165, 90, 0.6);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col antialiased">

  <!-- TOP HEADER BAR -->
  <header class="h-12 bg-[#1e1f22] border-b border-[#111214] flex items-center justify-between px-4 z-20 shrink-0">
    <div class="flex items-center space-x-2">
      <i class="fa-brands fa-discord text-[#5865f2] text-xl"></i>
      <span class="font-bold text-white text-sm tracking-wide">CTCSE | Chat, Talk, Call, Share, Enjoy</span>
      <span id="syncBadge" class="ml-3 text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20 flex items-center gap-1.5 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="syncStatusText">Cloud Live</span>
      </span>
    </div>
    <div class="flex items-center space-x-3 text-gray-400 text-sm">
      <button onclick="toggleUserBoard()" class="hover:text-white transition p-1" title="User Board">
        <i class="fa-solid fa-users"></i>
      </button>
      <button onclick="openSettings()" class="hover:text-white transition p-1" title="User Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    
    <!-- SERVER SIDEBAR -->
    <nav class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 shrink-0 border-r border-[#2b2d31]">
      <div class="w-12 h-12 bg-[#5865f2] rounded-2xl flex items-center justify-center text-white cursor-pointer hover:rounded-xl transition-all duration-200 shadow-lg">
        <i class="fa-brands fa-discord text-2xl"></i>
      </div>
      <div class="w-8 h-[2px] bg-[#35363c] rounded my-1"></div>
      <div class="relative group">
        <div class="w-12 h-12 bg-[#313338] text-indigo-400 rounded-3xl flex items-center justify-center font-bold text-xs hover:bg-[#5865f2] hover:text-white hover:rounded-xl transition-all duration-200 cursor-pointer border border-indigo-500/30">
          CTCSE
        </div>
      </div>
    </nav>

    <!-- CHANNEL & USER SIDEBAR -->
    <aside class="w-60 bg-[#2b2d31] flex flex-col shrink-0 border-r border-[#1e1f22]">
      <div class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between font-bold text-white shadow-sm">
        <span class="truncate">CTCSE Community</span>
        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
      </div>

      <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-4">
        <!-- TEXT CHANNELS -->
        <div>
          <div class="text-xs font-bold text-gray-400 px-2 mb-1 tracking-wider uppercase flex items-center justify-between">
            <span>TEXT CHANNELS</span>
          </div>
          <div id="channelList" class="space-y-0.5">
            <button onclick="switchChannel('general')" id="chan-general" class="channel-btn w-full flex items-center space-x-2 px-2 py-1.5 rounded text-white bg-[#404249] font-medium text-sm">
              <i class="fa-solid fa-hashtag text-gray-400"></i>
              <span>general</span>
            </button>
            <button onclick="switchChannel('announcements')" id="chan-announcements" class="channel-btn w-full flex items-center space-x-2 px-2 py-1.5 rounded text-gray-400 hover:bg-[#35373c] hover:text-gray-200 font-medium text-sm">
              <i class="fa-solid fa-bullhorn text-gray-400"></i>
              <span>announcements</span>
            </button>
            <button onclick="switchChannel('tech-lounge')" id="chan-tech-lounge" class="channel-btn w-full flex items-center space-x-2 px-2 py-1.5 rounded text-gray-400 hover:bg-[#35373c] hover:text-gray-200 font-medium text-sm">
              <i class="fa-solid fa-hashtag text-gray-400"></i>
              <span>tech-lounge</span>
            </button>
          </div>
        </div>

        <!-- USERS / DIRECT MESSAGES SECTION -->
        <div>
          <div class="text-xs font-bold text-gray-400 px-2 mb-1 tracking-wider uppercase flex items-center justify-between">
            <span>DIRECT MESSAGES</span>
          </div>
          <div class="px-2 mb-2">
            <form onsubmit="addUserByUsername(event)" class="flex items-center bg-[#1e1f22] rounded px-2 py-1 border border-gray-700 focus-within:border-indigo-500">
              <input type="text" id="addUsernameInput" placeholder="User ID / Username..." class="bg-transparent text-xs text-white focus:outline-none w-full placeholder-gray-500">
              <button type="submit" class="text-gray-400 hover:text-white text-xs ml-1">
                <i class="fa-solid fa-user-plus"></i>
              </button>
            </form>
          </div>
          <div id="userDmList" class="space-y-0.5">
            <!-- User Direct Message Channels populate dynamically -->
          </div>
        </div>

        <!-- VOICE CHANNELS -->
        <div>
          <div class="text-xs font-bold text-gray-400 px-2 mb-1 tracking-wider uppercase">
            <span>VOICE CHANNELS</span>
          </div>
          <div class="space-y-0.5">
            <button onclick="joinVoiceChannel('General Voice')" id="voice-btn-General-Voice" class="voice-chan-btn w-full flex items-center justify-between px-2 py-1.5 rounded text-gray-400 hover:bg-[#35373c] hover:text-gray-200 font-medium text-sm">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-volume-high text-gray-400" id="voice-icon-General-Voice"></i>
                <span>General Voice</span>
              </div>
              <span id="voice-count-General-Voice" class="text-xs text-gray-500"></span>
            </button>
            <button onclick="joinVoiceChannel('Gaming Room')" id="voice-btn-Gaming-Room" class="voice-chan-btn w-full flex items-center justify-between px-2 py-1.5 rounded text-gray-400 hover:bg-[#35373c] hover:text-gray-200 font-medium text-sm">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-gamepad text-gray-400" id="voice-icon-Gaming-Room"></i>
                <span>Gaming Room</span>
              </div>
              <span id="voice-count-Gaming-Room" class="text-xs text-gray-500"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- VOICE CONNECTION BAR -->
      <div id="voiceConnectionBar" class="bg-[#111214] border-t border-[#1e1f22] p-2 flex flex-col space-y-1 hidden">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2 text-xs text-emerald-400 font-semibold truncate">
            <i class="fa-solid fa-wifi animate-pulse"></i>
            <span id="activeVoiceChannelName" class="truncate">Voice Connected</span>
          </div>
          <button onclick="leaveVoiceChannel()" title="Disconnect" class="bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white text-xs p-1.5 rounded-full transition">
            <i class="fa-solid fa-phone-slash"></i>
          </button>
        </div>
        <div class="text-[11px] text-gray-400 truncate">RTC Mesh Active</div>
      </div>

      <!-- USER PROFILE BAR -->
      <div class="h-14 bg-[#232428] px-2 flex items-center justify-between border-t border-[#1e1f22]">
        <div class="flex items-center space-x-2 min-w-0 flex-1">
          <div class="relative shrink-0">
            <img id="userAvatar" src="" class="w-8 h-8 rounded-full bg-gray-700">
            <div class="w-3 h-3 bg-emerald-500 rounded-full absolute bottom-0 right-0 border-2 border-[#232428]"></div>
          </div>
          <div class="truncate">
            <div id="userDisplayName" class="text-sm font-semibold text-white leading-tight truncate">User</div>
            <div id="userTag" class="text-xs text-gray-400 leading-tight">#0001</div>
          </div>
        </div>
        
        <!-- AUDIO TOGGLE CONTROLS -->
        <div class="flex items-center space-x-0.5 text-gray-400 shrink-0">
          <button id="micToggleBtn" onclick="toggleMute()" class="p-1.5 hover:bg-[#35373c] hover:text-white rounded transition" title="Mute Microphone">
            <i class="fa-solid fa-microphone" id="micIcon"></i>
          </button>
          <button id="deafenToggleBtn" onclick="toggleDeafen()" class="p-1.5 hover:bg-[#35373c] hover:text-white rounded transition" title="Deafen Headset">
            <i class="fa-solid fa-headphones" id="deafenIcon"></i>
          </button>
          <button onclick="openSettings()" class="p-1.5 hover:bg-[#35373c] hover:text-white rounded transition" title="Settings">
            <i class="fa-solid fa-gear"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN CHAT & VOICE AREA -->
    <main class="flex-1 flex flex-col bg-[#313338] relative overflow-hidden">
      
      <!-- CHANNEL HEADER -->
      <header class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between shadow-sm shrink-0 bg-[#313338]">
        <div class="flex items-center space-x-2">
          <i id="channelHeaderIcon" class="fa-solid fa-hashtag text-gray-400 text-lg"></i>
          <span id="channelTitle" class="font-bold text-white">general</span>
        </div>
        <button onclick="toggleUserBoard()" class="text-gray-400 hover:text-white transition p-1" title="Toggle Users Board">
          <i class="fa-solid fa-users text-lg"></i>
        </button>
      </header>

      <!-- VOICE CALL ACTIVE STAGE -->
      <div id="voiceStage" class="bg-[#1e1f22] p-4 border-b border-[#111214] hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Voice Channel Participants</span>
          <span id="peerStatus" class="text-xs text-emerald-400 font-mono">Peer Network Ready</span>
        </div>
        <div id="voiceGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          <!-- Active voice call avatars render here -->
        </div>
      </div>

      <!-- MESSAGES FEED -->
      <div id="messagesFeed" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
        <!-- Messages populate here -->
      </div>

      <!-- INPUT BOX -->
      <div class="p-4 bg-[#313338] shrink-0">
        <form onsubmit="handleSend(event)" class="bg-[#383a40] rounded-lg px-4 py-2.5 flex items-center space-x-3 shadow-inner">
          <input type="text" id="chatInput" autocomplete="off" placeholder="Message #general..." class="bg-transparent text-white focus:outline-none w-full placeholder-gray-500 text-sm">
          <button type="submit" class="text-[#5865f2] hover:text-indigo-400 font-bold text-sm px-2 py-1">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>

    </main>

    <!-- RIGHT USER BOARD SIDEBAR -->
    <aside id="userBoard" class="w-60 bg-[#2b2d31] flex flex-col shrink-0 border-l border-[#1e1f22] p-3 space-y-3">
      <div class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">
        Active Community Users
      </div>
      <div id="activeUsersList" class="space-y-1 overflow-y-auto custom-scrollbar flex-1">
        <!-- Dynamic list of known users -->
      </div>
    </aside>

  </div>

  <!-- Audio elements container for WebRTC incoming streams -->
  <div id="remoteAudioContainer" class="hidden"></div>

  <!-- USER SETUP MODAL -->
  <div id="userModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden backdrop-blur-sm">
    <div class="bg-[#313338] border border-[#2b2d31] w-full max-w-md rounded-xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 id="modalTitle" class="text-lg font-bold text-white">Set Up Profile</h3>
        <button id="modalCloseBtn" onclick="closeSettings()" class="text-gray-400 hover:text-white hidden">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-gray-300 uppercase">Username / User ID</label>
          <input type="text" id="modalUsername" placeholder="e.g. GamerPro" class="w-full bg-[#1e1f22] border border-gray-700 rounded p-2 text-white text-sm focus:outline-none focus:border-indigo-500 mt-1">
        </div>
      </div>
      <div class="flex justify-end pt-2">
        <button onclick="saveUserProfile()" class="bg-[#5865f2] hover:bg-indigo-600 text-white font-medium px-4 py-2 rounded text-sm transition w-full">
          Save & Enter CTCSE
        </button>
      </div>
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    let binId = localStorage.getItem("ctcse_bin_id") || "6ac0f397ac6210605a0f6095";
    let apiKey = localStorage.getItem("ctcse_api_key") || "$2a$10$UgGUvGH2youShCEPp3izVu5qJ353t6F7U5kjgHptmQUTSKYRSnWK.";

    let currentChannel = "general";
    
    let currentUser = {
      username: localStorage.getItem("ctcse_fixed_user") || "",
      tag: localStorage.getItem("ctcse_fixed_tag") || "#" + Math.floor(1000 + Math.random() * 9000)
    };

    let dmUsers = JSON.parse(localStorage.getItem("ctcse_dm_users") || "[]");

    let allChannelData = {
      general: [{ id: "msg_bot", userName: "CTCSE Bot", text: "Welcome to #general!", timestamp: Date.now() }],
      announcements: [],
      "tech-lounge": []
    };

    // Voice Calling State
    let activeVoiceChannel = null;
    let localStream = null;
    let peer = null;
    let peerConnections = {};
    let isMuted = false;
    let isDeafened = false;
    let voiceParticipants = []; // Syncs via JSONBin
    let audioAnalyser = null;
    let animFrame = null;

    function initApp() {
      if (!currentUser.username) {
        document.getElementById("userModal").classList.remove("hidden");
      } else {
        updateProfileUI();
        renderUserDmList();
        syncFromCloud();
      }
      setInterval(syncFromCloud, 3000);
    }

    function updateProfileUI() {
      document.getElementById("userDisplayName").innerText = currentUser.username;
      document.getElementById("userTag").innerText = currentUser.tag;
      document.getElementById("userAvatar").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.username}`;
    }

    function saveUserProfile() {
      const uname = document.getElementById("modalUsername").value.trim();
      if (!uname) return alert("Enter username!");
      currentUser.username = uname;
      localStorage.setItem("ctcse_fixed_user", uname);
      localStorage.setItem("ctcse_fixed_tag", currentUser.tag);
      updateProfileUI();
      document.getElementById("userModal").classList.add("hidden");
      syncFromCloud();
    }

    function toggleUserBoard() {
      const board = document.getElementById("userBoard");
      board.classList.toggle("hidden");
    }

    function getDmChannelKey(userA, userB) {
      const sorted = [userA.toLowerCase(), userB.toLowerCase()].sort();
      return `dm_${sorted[0]}_${sorted[1]}`;
    }

    function addUserByUsername(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("addUsernameInput");
      const targetUser = input.value.trim();
      if (!targetUser) return;
      if (targetUser.toLowerCase() === currentUser.username.toLowerCase()) {
        alert("You cannot message yourself.");
        return;
      }
      
      addDmUserToSidebar(targetUser);
      input.value = "";
      switchChannel("@" + targetUser);
    }

    function addDmUserToSidebar(targetUser) {
      if (!dmUsers.some(u => u.toLowerCase() === targetUser.toLowerCase())) {
        dmUsers.push(targetUser);
        localStorage.setItem("ctcse_dm_users", JSON.stringify(dmUsers));
        renderUserDmList();
      }
    }

    function removeDmUser(targetUser, e) {
      if (e) e.stopPropagation();
      dmUsers = dmUsers.filter(u => u.toLowerCase() !== targetUser.toLowerCase());
      localStorage.setItem("ctcse_dm_users", JSON.stringify(dmUsers));
      renderUserDmList();
      if (currentChannel === "@" + targetUser) {
        switchChannel("general");
      }
    }

    function renderUserDmList() {
      const dmContainer = document.getElementById("userDmList");
      dmContainer.innerHTML = "";
      dmUsers.forEach(uname => {
        const div = document.createElement("div");
        div.className = "group relative flex items-center justify-between px-2 py-1.5 rounded hover:bg-[#35373c] text-gray-400 hover:text-gray-200 cursor-pointer text-sm font-medium transition";
        div.id = `chan-@${uname}`;
        div.onclick = () => switchChannel("@" + uname);

        div.innerHTML = `
          <div class="flex items-center space-x-2 truncate">
            <i class="fa-solid fa-at text-xs text-gray-400"></i>
            <span class="truncate">${escapeHtml(uname)}</span>
          </div>
          <button onclick="removeDmUser('${escapeHtml(uname)}', event)" title="Remove Chat" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-400 px-1 text-xs transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        dmContainer.appendChild(div);
      });
    }

    function switchChannel(channel) {
      currentChannel = channel;
      document.getElementById("channelTitle").innerText = channel;

      const headerIcon = document.getElementById("channelHeaderIcon");
      if (channel.startsWith("@")) {
        headerIcon.className = "fa-solid fa-at text-gray-400 text-lg";
      } else if (channel === "announcements") {
        headerIcon.className = "fa-solid fa-bullhorn text-gray-400 text-lg";
      } else {
        headerIcon.className = "fa-solid fa-hashtag text-gray-400 text-lg";
      }

      document.querySelectorAll(".channel-btn, #userDmList > div").forEach(btn => {
        btn.classList.remove("bg-[#404249]", "text-white");
        btn.classList.add("text-gray-400");
      });

      const activeBtn = document.getElementById(`chan-${channel}`);
      if (activeBtn) activeBtn.classList.add("bg-[#404249]", "text-white");

      document.getElementById("chatInput").placeholder = `Message ${channel.startsWith('@') ? channel : '#' + channel}...`;
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById("messagesFeed");
      let msgs = [];
      let displayTitle = currentChannel;

      if (currentChannel.startsWith("@")) {
        const targetUser = currentChannel.substring(1);
        const dmKey = getDmChannelKey(currentUser.username, targetUser);
        msgs = allChannelData[dmKey] || [];
        displayTitle = "@" + targetUser;
      } else {
        msgs = allChannelData[currentChannel] || [];
        displayTitle = "#" + currentChannel;
      }

      feed.innerHTML = `<div class="mb-4 text-2xl font-bold text-white">Welcome to ${escapeHtml(displayTitle)}!</div>`;

      msgs.forEach(msg => {
        const div = document.createElement("div");
        div.className = "group relative flex items-start justify-between space-x-3 hover:bg-[#2e3035] -mx-4 px-4 py-1.5 transition rounded";
        const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const isOwner = msg.userName === currentUser.username;

        div.innerHTML = `
          <div class="flex items-start space-x-3 min-w-0 flex-1">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${msg.userName}" class="w-10 h-10 rounded-full bg-gray-700 shrink-0">
            <div class="min-w-0 flex-1">
              <div class="flex items-baseline space-x-2">
                <span class="font-semibold text-white text-sm">${escapeHtml(msg.userName)}</span>
                <span class="text-xs text-gray-400">${timeStr}</span>
              </div>
              <p class="text-gray-300 text-sm break-words">${escapeHtml(msg.text)}</p>
            </div>
          </div>
          ${isOwner ? `
            <button onclick="deleteMessage('${msg.id}')" title="Delete message" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-400 p-1 rounded transition">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          ` : ''}
        `;
        feed.appendChild(div);
      });
      feed.scrollTop = feed.scrollHeight;
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text || !currentUser.username) return;

      const newMsg = {
        id: "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
        userName: currentUser.username,
        text: text,
        timestamp: Date.now()
      };

      let storageKey = currentChannel;
      if (currentChannel.startsWith("@")) {
        const targetUser = currentChannel.substring(1);
        storageKey = getDmChannelKey(currentUser.username, targetUser);
        addDmUserToSidebar(targetUser);
      }

      if (!allChannelData[storageKey]) allChannelData[storageKey] = [];
      allChannelData[storageKey].push(newMsg);
      input.value = "";
      renderFeed();
      await saveToCloud();
    }

    async function deleteMessage(msgId) {
      let storageKey = currentChannel;
      if (currentChannel.startsWith("@")) {
        const targetUser = currentChannel.substring(1);
        storageKey = getDmChannelKey(currentUser.username, targetUser);
      }

      if (!allChannelData[storageKey]) return;
      allChannelData[storageKey] = allChannelData[storageKey].filter(m => {
        if (m.id === msgId) {
          return m.userName !== currentUser.username;
        }
        return true;
      });
      renderFeed();
      await saveToCloud();
    }

    async function joinVoiceChannel(channelName) {
      if (activeVoiceChannel === channelName) return;

      if (activeVoiceChannel) {
        leaveVoiceChannel();
      }

      activeVoiceChannel = channelName;
      document.getElementById("voiceConnectionBar").classList.remove("hidden");
      document.getElementById("activeVoiceChannelName").innerText = channelName;
      document.getElementById("voiceStage").classList.remove("hidden");

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        console.warn("Microphone access denied or unavailable. Connecting in listen-only mode.", err);
        localStream = new MediaStream();
      }

      setupSpeakingDetection();

      const peerId = "ctcse_" + currentUser.username.replace(/[^a-zA-Z0-9]/g, "");
      peer = new Peer(peerId);

      peer.on('open', (id) => {
        document.getElementById("peerStatus").innerText = "Voice Connected (" + id.substring(6) + ")";
        updateVoiceParticipantsCloud(true);
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          attachRemoteStream(call.peer, remoteStream);
        });
        peerConnections[call.peer] = call;
      });

      peer.on('error', (err) => {
        console.error("PeerJS Error:", err);
      });

      renderVoiceStage();
    }

    function setupSpeakingDetection() {
      if (!localStream || localStream.getAudioTracks().length === 0) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(localStream);
        audioAnalyser = audioCtx.createAnalyser();
        audioAnalyser.fftSize = 512;
        source.connect(audioAnalyser);

        const dataArray = new Uint8Array(audioAnalyser.frequencyBinCount);

        function checkVolume() {
          if (!activeVoiceChannel) return;
          audioAnalyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;

          const myAvatar = document.getElementById("avatar-voice-" + currentUser.username);
          if (myAvatar) {
            if (average > 15 && !isMuted) {
              myAvatar.classList.add("speaking-glow");
            } else {
              myAvatar.classList.remove("speaking-glow");
            }
          }
          animFrame = requestAnimationFrame(checkVolume);
        }
        checkVolume();
      } catch(e) {
        console.error("Audio detection error:", e);
      }
    }

    function attachRemoteStream(peerId, stream) {
      let audioEl = document.getElementById("audio-peer-" + peerId);
      if (!audioEl) {
        audioEl = document.createElement("audio");
        audioEl.id = "audio-peer-" + peerId;
        audioEl.autoplay = true;
        document.getElementById("remoteAudioContainer").appendChild(audioEl);
      }
      audioEl.srcObject = stream;
      audioEl.muted = isDeafened;
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById("micToggleBtn");
      const icon = document.getElementById("micIcon");

      if (localStream && localStream.getAudioTracks().length > 0) {
        localStream.getAudioTracks()[0].enabled = !isMuted;
      }

      if (isMuted) {
        btn.classList.add("text-red-400", "bg-red-500/10");
        icon.className = "fa-solid fa-microphone-slash";
      } else {
        btn.classList.remove("text-red-400", "bg-red-500/10");
        icon.className = "fa-solid fa-microphone";
      }
      renderVoiceStage();
    }

    function toggleDeafen() {
      isDeafened = !isDeafened;
      const btn = document.getElementById("deafenToggleBtn");
      const icon = document.getElementById("deafenIcon");

      const remoteAudios = document.querySelectorAll("#remoteAudioContainer audio");
      remoteAudios.forEach(aud => aud.muted = isDeafened);

      if (isDeafened) {
        btn.classList.add("text-red-400", "bg-red-500/10");
        icon.className = "fa-solid fa-ear-deafen";
      } else {
        btn.classList.remove("text-red-400", "bg-red-500/10");
        icon.className = "fa-solid fa-headphones";
      }
      renderVoiceStage();
    }

    function leaveVoiceChannel() {
      if (!activeVoiceChannel) return;

      updateVoiceParticipantsCloud(false);

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      if (peer) {
        peer.destroy();
        peer = null;
      }

      if (animFrame) cancelAnimationFrame(animFrame);

      peerConnections = {};
      document.getElementById("remoteAudioContainer").innerHTML = "";

      activeVoiceChannel = null;
      document.getElementById("voiceConnectionBar").classList.add("hidden");
      document.getElementById("voiceStage").classList.add("hidden");
    }

    function renderVoiceStage() {
      if (!activeVoiceChannel) return;
      const grid = document.getElementById("voiceGrid");
      grid.innerHTML = "";

      let channelPeers = voiceParticipants.filter(p => p.channel === activeVoiceChannel);
      
      if (!channelPeers.find(p => p.username === currentUser.username)) {
        channelPeers.push({
          username: currentUser.username,
          channel: activeVoiceChannel
        });
      }

      channelPeers.forEach(p => {
        if (p.username !== currentUser.username && peer && !peerConnections["ctcse_" + p.username.replace(/[^a-zA-Z0-9]/g, "")]) {
          const targetPeerId = "ctcse_" + p.username.replace(/[^a-zA-Z0-9]/g, "");
          const call = peer.call(targetPeerId, localStream);
          if (call) {
            call.on('stream', (remoteStream) => {
              attachRemoteStream(targetPeerId, remoteStream);
            });
            peerConnections[targetPeerId] = call;
          }
        }

        const card = document.createElement("div");
        card.className = "bg-[#2b2d31] border border-[#1e1f22] rounded-xl p-3 flex flex-col items-center justify-center space-y-2 relative shadow";

        const isMe = p.username === currentUser.username;

        card.innerHTML = `
          <div class="relative">
            <img id="avatar-voice-${p.username}" src="https://api.dicebear.com/7.x/bottts/svg?seed=${p.username}" class="w-14 h-14 rounded-full bg-gray-700 transition-all duration-150">
            ${isMe && isMuted ? `
              <div class="absolute bottom-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
                <i class="fa-solid fa-microphone-slash"></i>
              </div>
            ` : ''}
          </div>
          <span class="text-xs font-semibold text-white truncate max-w-full">${escapeHtml(p.username)} ${isMe ? '(You)' : ''}</span>
        `;
        grid.appendChild(card);
      });
    }

    async function syncFromCloud() {
      if (!binId || !apiKey) return;
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
          headers: { "X-Master-Key": apiKey }
        });
        if (res.ok) {
          const json = await res.json();
          if (json.record) {
            if (json.record.channels) {
              allChannelData = json.record.channels;
              checkForIncomingDirectMessages();
              renderFeed();
            }
            if (json.record.voiceParticipants) {
              voiceParticipants = json.record.voiceParticipants;
              updateVoiceChannelCounts();
              if (activeVoiceChannel) renderVoiceStage();
            }
            renderActiveUsersBoard();
          }
        }
      } catch(err) {}
    }

    function checkForIncomingDirectMessages() {
      if (!currentUser.username) return;
      const myUnameLower = currentUser.username.toLowerCase();

      Object.keys(allChannelData).forEach(key => {
        if (key.startsWith("dm_")) {
          const parts = key.split("_");
          if (parts.length === 3) {
            const user1 = parts[1];
            const user2 = parts[2];
            let otherUser = null;

            if (user1 === myUnameLower) otherUser = user2;
            else if (user2 === myUnameLower) otherUser = user1;

            if (otherUser) {
              const msgs = allChannelData[key];
              if (msgs && msgs.length > 0) {
                const hasIncomingMsg = msgs.some(m => m.userName.toLowerCase() !== myUnameLower);
                if (hasIncomingMsg) {
                  const actualSender = msgs.find(m => m.userName.toLowerCase() !== myUnameLower).userName;
                  addDmUserToSidebar(actualSender);
                }
              }
            }
          }
        }
      });
    }

    function renderActiveUsersBoard() {
      const usersListEl = document.getElementById("activeUsersList");
      if (!usersListEl) return;
      usersListEl.innerHTML = "";

      const knownUsers = new Set();
      if (currentUser.username) knownUsers.add(currentUser.username);

      Object.values(allChannelData).forEach(channelMsgs => {
        if (Array.isArray(channelMsgs)) {
          channelMsgs.forEach(m => {
            if (m.userName) knownUsers.add(m.userName);
          });
        }
      });

      knownUsers.forEach(uname => {
        const isMe = uname === currentUser.username;
        const div = document.createElement("div");
        div.className = "flex items-center space-x-2 p-1.5 hover:bg-[#35373c] rounded cursor-pointer transition";
        div.onclick = () => {
          if (!isMe) {
            addDmUserToSidebar(uname);
            switchChannel("@" + uname);
          }
        };

        div.innerHTML = `
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${uname}" class="w-7 h-7 rounded-full bg-gray-700">
          <span class="text-sm font-medium text-gray-200 truncate flex-1">${escapeHtml(uname)} ${isMe ? '(You)' : ''}</span>
        `;
        usersListEl.appendChild(div);
      });
    }

    async function updateVoiceParticipantsCloud(isJoining) {
      if (!binId || !apiKey) return;

      voiceParticipants = voiceParticipants.filter(p => p.username !== currentUser.username);

      if (isJoining && activeVoiceChannel) {
        voiceParticipants.push({
          username: currentUser.username,
          channel: activeVoiceChannel,
          lastSeen: Date.now()
        });
      }

      await saveToCloud();
    }

    function updateVoiceChannelCounts() {
      const counts = {};
      voiceParticipants.forEach(p => {
        counts[p.channel] = (counts[p.channel] || 0) + 1;
      });

      ['General Voice', 'Gaming Room'].forEach(chan => {
        const countEl = document.getElementById(`voice-count-${chan.replace(/\s+/g, '-')}`);
        if (countEl) {
          const c = counts[chan] || 0;
          countEl.innerText = c > 0 ? `${c} connected` : '';
        }
      });
    }

    async function saveToCloud() {
      if (!binId || !apiKey) return;
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": apiKey },
          body: JSON.stringify({ 
            channels: allChannelData,
            voiceParticipants: voiceParticipants 
          })
        });
      } catch(err) {}
    }

    function openSettings() {
      document.getElementById("modalUsername").value = currentUser.username;
      document.getElementById("userModal").classList.remove("hidden");
    }

    function closeSettings() {
      if (currentUser.username) document.getElementById("userModal").classList.add("hidden");
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Initialize platform
    initApp();
  </script>
</body>
</html>
